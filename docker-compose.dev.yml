# ⚠️ نسخهٔ ویندوز: به‌جای این فایل، از docker-compose.dev.windows.yml استفاده کنید.
# این فایل برای macOS/Linux با bind-mount مستقیم است.
# راهنما: docker compose -f docker-compose.dev.windows.yml up -d --build

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile.dev
    image: nurse-prototype:dev
    container_name: nurse-prototype-dev
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - ./:/app
      - nurse_node_modules:/app/node_modules
      - nurse_next:/app/.next
    environment:
      NODE_ENV: development
      NEXT_TELEMETRY_DISABLED: "1"
      WATCHPACK_POLLING: "true"
      CHOKIDAR_USEPOLLING: "true"
    stdin_open: true
    tty: true
    restart: "no"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:3000/ >/dev/null || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

volumes:
  nurse_node_modules:
  nurse_next:
